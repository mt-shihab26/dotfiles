# config-file = ?"~/.config/ghostty/overwrite.conf"

font-size = 12

window-padding-x = 2
window-padding-y = 2

command = zsh -c "~/.bin/init; exec zsh"

window-show-tab-bar = never

keybind = ctrl+shift+t=ignore
keybind = ctrl+shift+q=ignore
keybind = ctrl+shift+w=ignore
keybind = ctrl+shift+bracket_right=ignore
keybind = ctrl+shift+bracket_left=ignore

keybind = ctrl+shift+c=copy_to_clipboard
keybind = ctrl+shift+v=paste_from_clipboard

# Ghostty can't launch a command from a keybinding like kitty does, so send
# Ctrl+Shift+p/o/l through to tmux (CSI-u), which opens the sessionizer in a popup
keybind = ctrl+shift+p=csi:112;6u
keybind = ctrl+shift+o=csi:111;6u
keybind = ctrl+shift+l=csi:108;6u

# Pass Ctrl+number keys to tmux for browser-like tab switching
keybind = ctrl+digit_1=csi:49;5u
keybind = ctrl+digit_2=csi:50;5u
keybind = ctrl+digit_3=csi:51;5u
keybind = ctrl+digit_4=csi:52;5u
keybind = ctrl+digit_5=csi:53;5u
keybind = ctrl+digit_6=csi:54;5u
keybind = ctrl+digit_7=csi:55;5u
keybind = ctrl+digit_8=csi:56;5u
keybind = ctrl+digit_9=csi:57;5u

# Pass Shift+Left/Right to tmux for browser-like tab switching
keybind = shift+arrow_left=csi:1;2D
keybind = shift+arrow_right=csi:1;2C
