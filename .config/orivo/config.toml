# Orivo configuration


show_fps = true # show the FPS counter in the TUI header on startup

# Pomodoro timer settings — controls session lengths and when long breaks are triggered.
[timer]
show_millis         = false   # show milliseconds in the timer display
work_duration       = 55     # work session length in minutes
break_duration      = 5      # short break length in minutes
long_break_duration = 15     # long break length in minutes
long_break_interval = 2      # number of work sessions before a long break
daily_session_goal  = 10     # target work sessions to complete today (min: 1, max: 24)
