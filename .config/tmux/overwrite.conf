# source-file ~/.config/tmux/overwrite.conf

# Show the running program in the tab name
set -gw automatic-rename-format '#{?@app,#{@app},#{pane_current_command}}'

# New window opens in session dir, not current pane dir
bind c new-window -c "#{session_path}"

# Move kill-pane from prefix x to prefix X, so a stray x can't close the tab
unbind x
bind -N "Kill pane" X kill-pane

# Browser-like tab switching with Shift+Left/Right and Alt+h/l
bind -n S-Left previous-window  # Shift+Left Arrow
bind -n S-Right next-window  # Shift+Right Arrow
bind -n M-h previous-window  # Alt+h
bind -n M-l next-window  # Alt+l

# Move current tab left/right with Shift+Alt+Arrow keys, keeping it active
bind -n S-M-Left swap-window -d -t -1  # Shift+Alt+Left Arrow
bind -n S-M-Right swap-window -d -t +1  # Shift+Alt+Right Arrow

# Browser-like tab switching with Ctrl+number
bind -n C-1 select-window -t 1  # Ctrl+1
bind -n C-2 select-window -t 2  # Ctrl+2
bind -n C-3 select-window -t 3  # Ctrl+3
bind -n C-4 select-window -t 4  # Ctrl+4
bind -n C-5 select-window -t 5  # Ctrl+5
bind -n C-6 select-window -t 6  # Ctrl+6
bind -n C-7 select-window -t 7  # Ctrl+7
bind -n C-8 select-window -t 8  # Ctrl+8
bind -n C-9 select-window -t 9  # Ctrl+9

# Accept extended keys (CSI-u) from ghostty, the base config only enables them for kitty
set -ag terminal-features "xterm-ghostty:extkeys"

# Map tmux 3.8's built-in theme palette to the terminal's ANSI colors, so copy mode, choose-tree,
# display-panes and scrollbars follow the omarchy theme instead of tmux's own grays and blues
set -s theme dark
set -s dark-theme-black "black"
set -s dark-theme-white "white"
set -s dark-theme-light-grey "brightblack"
set -s dark-theme-dark-grey "black"
set -s dark-theme-green "green"
set -s dark-theme-yellow "yellow"
set -s dark-theme-red "red"
set -s dark-theme-blue "blue"
set -s dark-theme-cyan "cyan"
set -s dark-theme-magenta "magenta"

# Popups and menus follow the terminal colors, tmux 3.8 defaults them to its own dark grey theme
set -g popup-style "bg=default,fg=default"
set -g popup-border-style "fg=blue"
set -g menu-style "bg=default,fg=default"
set -g menu-selected-style "bg=blue,fg=black"
set -g menu-border-style "fg=blue"

# Open the sessionizer in a popup with Ctrl+Shift+p/o/l, passed through by kitty and ghostty
bind -n C-S-p display-popup -E -w 80% -h 70% "~/.bin/sessionizer projects"
bind -n C-S-o display-popup -E -w 80% -h 70% "~/.bin/sessionizer other"
bind -n C-S-l display-popup -E -w 80% -h 70% "~/.bin/sessionizer learns"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

run '~/.tmux/plugins/tpm/tpm'
